<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>נגריית איאן — בוט מכירות AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Assistant', sans-serif; }
        body {
            background: linear-gradient(135deg, #1e1e24 0%, #111116 100%);
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .icon { font-size: 64px; margin-bottom: 16px; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; color: #f97316; }
        p { color: #9ca3af; line-height: 1.6; margin-bottom: 24px; font-size: 16px; }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
        }
        .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🪚</div>
        <h1>נגריית איאן</h1>
        <p>סוכן מכירות AI חכם בטלגרם — מחובר ופועל בהצלחה ב-Serverless על גבי Vercel ו-Google Gemini.</p>
        <div class="status">
            <span class="dot"></span>
            השרת פעיל ותקין
        </div>
    </div>
</body>
</html>
